version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: angular_blog
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      # Local development
      - "traefik.http.routers.angular-blog-local.rule=Host(`angular.localhost`)"
      - "traefik.http.routers.angular-blog-local.entrypoints=websecure"
      - "traefik.http.routers.angular-blog-local.tls=true"
      # Production
      - "traefik.http.routers.angular-blog.rule=Host(`angular.prstart.hu`)"
      - "traefik.http.routers.angular-blog.entrypoints=websecure"
      - "traefik.http.routers.angular-blog.tls=true"
      - "traefik.http.routers.angular-blog.tls.certresolver=myresolver"
      
      - "traefik.http.services.angular-blog.loadbalancer.server.port=80"
    networks:
      - traefik

  api:
    build: ./api
    container_name: angular_blog_api
    restart: unless-stopped
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - MODEL_NAME=angular_assistant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.angular-blog-api.rule=Host(`angular.prstart.hu`) && PathPrefix(`/api`)"
      - "traefik.http.routers.angular-blog-api.entrypoints=websecure"
      - "traefik.http.routers.angular-blog-api.tls=true"
      - "traefik.http.routers.angular-blog-api.tls.certresolver=myresolver"
      - "traefik.http.services.angular-blog-api.loadbalancer.server.port=3000"
    networks:
      - traefik

networks:
  traefik:
    external: true
